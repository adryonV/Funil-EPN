name: Build & Deploy — Funil de Tráfego (EPN)

on:
  # Agendador na nuvem (backup): a cada 2 horas no minuto 0 (UTC).
  schedule:
    - cron: '0 */2 * * *'
  # Botão "Run workflow" na aba Actions.
  workflow_dispatch:
  # Gatilho externo do cron-job.org (POST /dispatches com event_type "rebuild").
  repository_dispatch:
    types: [rebuild]
  # Deploy automático em cada push na main.
  push:
    branches: [main]

# Só precisa escrever na branch gh-pages. NÃO usa OIDC/Pages environment
# (evita o erro transitório "Invalid actions OIDC token" do deploy-pages).
permissions:
  contents: write

# Runs enfileiram em vez de se cancelarem (evita cascata de "cancelled").
concurrency:
  group: deploy-epn
  cancel-in-progress: false

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Buscar planilhas e gerar public/data.json
        run: node build.mjs

      - name: Publicar public/ na branch gh-pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd public
          touch .nojekyll
          git init -q
          git checkout -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "deploy: build $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
